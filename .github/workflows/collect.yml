name: collect-k200

on:
  schedule:
    - cron: "47 6 * * 1-5"  # KST 월-금 15:47
    - cron: "23 7 * * 1-5"  # KST 월-금 16:23
  workflow_dispatch:
    inputs:
      date:
        description: "거래일 YYYY-MM-DD (KST, 비우면 오늘)"
        required: false
        default: ""
      dry_run:
        description: "true면 upsert 생략"
        required: false
        default: "false"
      force:
        description: "true면 주말/휴장일 스킵 무시"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Collect 1m bars
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python collector/collect.py $ARGS
