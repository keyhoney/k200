name: collect-k200

on:
  schedule:
    - cron: "47 6 * * 1-5" # KST 월~금 15:47
    - cron: "23 7 * * 1-5" # KST 월~금 16:23

  workflow_dispatch:
    inputs:
      date:
        description: "거래일 YYYY-MM-DD (KST, 비우면 오늘)"
        required: false
        default: ""
      dry_run:
        description: "true면 upsert 생략"
        required: false
        default: "false"
      force:
        description: "true면 주말/휴장일 스킵 무시"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: collect-k200
  cancel-in-progress: false

jobs:
  collect:
    name: Collect K200 1m Bars
    runs-on: ubuntu-24.04

    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Validate required secrets
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          for v in \
            KIS_APP_KEY \
            KIS_APP_SECRET \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret: $v"
              exit 1
            fi
          done

      - name: Collect 1m bars
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          args=()

          if [ -n "${INPUT_DATE}" ]; then
            args+=(--date "${INPUT_DATE}")
          fi

          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "${INPUT_FORCE}" = "true" ]; then
            args+=(--force)
          fi

          echo "Starting collector..."
          python collector/collect.py "${args[@]}"
